# ============================================================================
# 目标环境：连接参数（库级隔离交给 MySQL 账号的 GRANT）
#
# 三套实例地址与 sql-review-mcp 的 settings.yaml 一致（同一批库、同一台宿主），
# 区别只在账号：审核用只读 ro_user，执行用有写权限的独立账号 exec_user。
# 三个环境共用同一个账号密码，由 /etc/sql-executor-mcp/sql-executor-mcp.env 注入。
#
# ⚠️ 库级隔离的唯一防线是 MySQL 账号的授权范围，账号必须按库授权，不能给 *.* ：
#     GRANT SELECT, INSERT, UPDATE, CREATE, ALTER, INDEX ON `demo_project`.* TO 'exec_user'@'%';
#     -- 不授 DELETE、DROP、SUPER、FILE、PROCESS、CREATE TEMPORARY TABLES
# 上线前用 scripts/probe_targets.py 实测每个账号的授权库范围与权限集合。
# ============================================================================

environments:
  dev:
    host: 10.0.0.50
    port: 3306
    user: exec_user
    password: ${EXEC_PASSWORD}
    charset: utf8mb4

  test:
    host: 10.0.10.171
    port: 3306
    user: exec_user
    password: ${EXEC_PASSWORD}
    charset: utf8mb4

  stage:
    host: 10.0.10.101
    port: 3306
    user: exec_user
    password: ${EXEC_PASSWORD}
    charset: utf8mb4
